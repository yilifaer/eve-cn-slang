# 每周检查一次 CCP 静态数据：插件数据（official/data/）或官方中英名称表有变化，
# 并且检查通过，就直接提交到 main（插件读的是 main，不用点合并）。变化列表写在这次运行的 Summary 页面里。
# 也可以在 GitHub 网页的 Actions 页面手动运行（Run workflow）。
name: update-official
on:
  schedule:
    - cron: "17 12 * * 3"  # 每周三 12:17 UTC（北京时间 20:17）；EVE 一般周二更新
  workflow_dispatch:
permissions:
  contents: write
# 手动运行和定时运行撞在一起时排队，不同时推送
concurrency:
  group: update-official
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pypinyin 固定版本：拼音库更新会改插件数据里的拼音列；要和 build_data.py 里的 PYPINYIN_VERSION 一致，升级时两边一起改
      - run: pip install pyyaml pypinyin==0.55.0
      # SDE 只下载一次：build_data.py 下载后把压缩包留下，build_official.py 直接用
      - id: build
        run: |
          python scripts/build_data.py --save-zip "$RUNNER_TEMP/sde.zip" --summary "$RUNNER_TEMP/changes-data.md"
          python scripts/build_official.py "$RUNNER_TEMP/sde.zip" --summary "$RUNNER_TEMP/changes-official.md"
          if [ -n "$(git status --porcelain -- official/data)" ]; then echo "data=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$(git status --porcelain -- official/eve-official.json official/eve-official.csv README.md)" ]; then echo "official=true" >> "$GITHUB_OUTPUT"; fi
      # 自动提交不会触发 check.yml，所以先在这里检查一遍，不通过就不提交
      - if: steps.build.outputs.data == 'true' || steps.build.outputs.official == 'true'
        run: |
          python scripts/check.py glossary.yaml
          python scripts/build_data.py --check
      # 插件数据和名称表各提交一次，直接推到 main。运行期间 main 有了新提交时先变基到最新的 main，再检查一遍才推送
      - if: steps.build.outputs.data == 'true' || steps.build.outputs.official == 'true'
        env:
          DATA: ${{ steps.build.outputs.data }}
          OFFICIAL: ${{ steps.build.outputs.official }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$DATA" = "true" ]; then
            build=$(python -c 'import json; print(json.load(open("official/data/manifest.json"))["buildNumber"])')
            git add official/data
            git commit -m "更新插件数据（build $build）"
            cat "$RUNNER_TEMP/changes-data.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$OFFICIAL" = "true" ]; then
            build=$(python -c 'import json; print(json.load(open("official/eve-official.json"))["buildNumber"])')
            git add official/eve-official.json official/eve-official.csv README.md
            git commit -m "更新官方中英名称表（build $build）"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/changes-official.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          git pull --rebase origin main
          python scripts/check.py glossary.yaml
          python scripts/build_data.py --check
          git push origin HEAD:main
