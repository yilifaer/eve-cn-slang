# 每周检查一次 CCP 静态数据，官方中英名称有变化就开一个合并请求。
# 也可以在 GitHub 网页的 Actions 页面手动运行（Run workflow）。
name: update-official
on:
  schedule:
    - cron: "17 12 * * 3"  # 每周三 12:17 UTC（北京时间 20:17）；EVE 一般周二更新
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: build
        run: |
          python scripts/build_official.py --summary "$RUNNER_TEMP/changes.md"
          if [ -n "$(git status --porcelain)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      # 自动开的合并请求不会触发 check.yml，所以先在这里检查一遍，不通过就不开
      - if: steps.build.outputs.changed == 'true'
        run: |
          pip install pyyaml
          python scripts/check.py glossary.yaml
      - if: steps.build.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/update-official
          commit-message: 更新官方中英名称表
          title: 更新官方中英名称表
          body-path: ${{ runner.temp }}/changes.md
          add-paths: |
            official/
            README.md
